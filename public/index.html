<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <cnc-header>
      <ui-button id="cnc-connect-button" variant="primary" size="md">
        CONECTAR
      </ui-button>
    </cnc-header>

    <cnc-body>
      <cnc-card class="thermal-panel">
        <cnc-thermal-monitor></cnc-thermal-monitor>
      </cnc-card>

      <cnc-card class="axis-panel">
        <cnc-axis-position></cnc-axis-position>
      </cnc-card>

      <cnc-card class="camera-panel">
        <camera-telemetry></camera-telemetry>
      </cnc-card>

      <cnc-card class="gcode-panel">
        <cnc-gcode-panel></cnc-gcode-panel>
      </cnc-card>
    </cnc-body>

    <cnc-footer></cnc-footer>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
